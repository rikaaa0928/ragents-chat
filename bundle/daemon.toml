node_id = "node-docker-01"
server_url = "http://ragents-apiserver:8080"
executor_mode = "subprocess"
max_concurrent_runners = 8
default_system_prompt = "You are a helpful AI assistant running inside the ragents container cluster."
# 集群模型与 Provider 凭据由 ragents-apiserver 集中管理并通过 DaemonTunnel 下发（默认 use_cluster_models = true）
use_cluster_models = true
temp_root_dir = "/var/lib/ragents/tmp"
extensions_dir = "/etc/ragents/wasm"
# 允许创建 Agent 工作目录 (workspace_path) 的父目录白名单（默认总是包含 /tmp）
allowed_workspace_dirs = ["/tmp", "/var/lib/ragents/workspaces"]
# 仅针对节点本地专属 `[models]` 自动探测 `/v1/models`（默认开启）
auto_discover_models = true

[labels]
env = "docker-compose"
role = "worker"

# 如需节点专属模型或覆盖集群同名模型，可按需取消注释并配置 `[models."..."]`
# [models."qwen3-local"]
# base_url = "http://127.0.0.1:8000/v1"
# api_key = "local-key"

[[extensions]]
name = "shell"
enabled = true
config = { default_timeout_seconds = 0, max_output_lines = 2000, max_output_bytes = 51200 }

[[extensions]]
name = "file_editor"
enabled = true
config = {}

[[extensions]]
name = "image_viewer"
enabled = true
config = {}

[[extensions]]
name = "agents_md"
enabled = true
config = {}

[[extensions]]
name = "skills"
enabled = true
config = { include_workspace = true, include_global = false }

[[extensions]]
name = "compaction"
enabled = true
config = { enabled = true, trigger_tokens = 400000, keep_recent_tokens = 64000 }

[[extensions]]
name = "session_history"
enabled = true
config = {}

[default_permissions.file_read]
allow = ["."]
default = "ask"

[default_permissions.file_write]
allow = ["."]
default = "ask"

[default_permissions.command_work_dir]
allow = ["."]
default = "ask"

[default_permissions.http_hosts]
allow = []
default = "ask"
