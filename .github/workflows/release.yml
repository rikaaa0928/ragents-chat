name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-web-and-wasm:
    name: Build Web UI & Chatroom WASM Bundle
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build Web UI
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Upload built Web UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/index.html

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache Rust WASM artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip2
          workspaces: extensions/chatroom

      - name: Build chatroom WASM & package bundles
        run: |
          ./scripts/build-chatroom-wasm.sh
          mkdir -p dist wasm-stage
          cp extensions/chatroom/target/wasm32-wasip2/release/ragent_chatroom_extension.wasm bundle/wasm/
          cp extensions/chatroom/target/wasm32-wasip2/release/ragent_chatroom_extension.wasm wasm-stage/
          chmod 0644 wasm-stage/*.wasm bundle/wasm/*.wasm

          tar -czf dist/ragents-chat-wasm.tar.gz -C wasm-stage .
          tar -czf dist/ragents-chat-bundle.tar.gz -C bundle .
          (
            cd dist
            sha256sum ragents-chat-wasm.tar.gz > ragents-chat-wasm.tar.gz.sha256
            sha256sum ragents-chat-bundle.tar.gz > ragents-chat-bundle.tar.gz.sha256
          )

      - name: Upload WASM & bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ragents-chat-bundle
          path: dist/*

  build-binaries:
    name: Build (${{ matrix.archive }})
    needs: [build-web-and-wasm]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: ragents-chat-linux-x86_64-musl
            use_zigbuild: true
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            archive: ragents-chat-linux-aarch64-musl
            use_zigbuild: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: ragents-chat-darwin-aarch64
            use_zigbuild: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built Web UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup Zig & cargo-zigbuild
        if: matrix.use_zigbuild
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build static musl release binary
        if: matrix.use_zigbuild
        run: |
          cargo zigbuild --release --target "${{ matrix.target }}" -p chatroom-server --bin ragents-chat

      - name: Build native macOS release binary
        if: ${{ !matrix.use_zigbuild }}
        run: |
          cargo build --release --target "${{ matrix.target }}" -p chatroom-server --bin ragents-chat
          strip "target/${{ matrix.target }}/release/ragents-chat"

      - name: Package release archive
        run: |
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/ragents-chat" stage/ragents-chat
          chmod 0755 stage/ragents-chat
          if [ "${{ runner.os }}" = "macOS" ]; then
            COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf "dist/${{ matrix.archive }}.tar.gz" -C stage .
            (cd dist && shasum -a 256 "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.tar.gz.sha256")
          else
            tar -czf "dist/${{ matrix.archive }}.tar.gz" -C stage .
            (cd dist && sha256sum "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.tar.gz.sha256")
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [build-web-and-wasm, build-binaries]
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build consolidated SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum *.tar.gz | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
